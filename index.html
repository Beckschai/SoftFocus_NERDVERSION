<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="style.css">
    <title>Session</title>
  </head>
  <body>
   <div class="screen">
     <!----PARTIE 1: IMAGE ----------->
      <img src="./images/Image ChatGPT 25 sept. 2026, 12_25_37.png" alt="Mon image de test" />

     <!----PARTIE 2: NAVIGATION ------>
      <div class="NavigationBar">

        <!---First element-->
        <div class="NavigationBarOpeningBoutton" >
          <img class="fit-picture" src="./images/Manette pixel art verte aux commandes roses.png" alt="Manette de jeu"/>
          <p>Démarrez</p>
        </div>
        <!---Second element-->
        <div class="BatteryPart">
          <img class="battery-picture" src="./images/Batterie horizontale vert forêt profond.png" alt="Batterie pourcentage logo"/>
          <p>97%</p>
        </div>
      </div>

      <!---PARTIE 3: SCROLLING MENU ---->
      <div class="NavigationScrollingMenu">
        <!-------->
          <div class="OnlineMenuSection">
            <div class="AvatarPhotoAndOnlineDot">
               <div class="AvatarPhotoAndDot"></div>
               <img src="./images/Portrait sépia en avatar circulaire.png" alt="Avatar"/>
            </div>
            <div class="AvatarPhotoAndNameAndOnlineStatus">
               <p>Van Ghog sista</p>
               <p>En ligne</p>
            </div>
          </div>
        <!--------->
          <div class="GamesInProgressMenuButoon">
            <img src="./images/Manette pixel vert émeraude foncé.png" alt="Manettes"/>
            <p>Jeux en cours</p>
          </div>

          <div class="PlayersGuideMenuButoon">
            <img src="./images/livre_fond_transparent.png" alt="Player guide"/>
            <p>Guide du joueur</p>
          </div>

          <div class="MyBalenceMenuButoon">
            <img src="./images/portefeuille_fond_transparent.png" alt="Portefeuille"/>
            <p>Mon solde</p>
          </div>
    
          <div class="AvatarsMenuButoon">
            <img src="./images/Deux utilisateurs en pixel art.png" alt="User avatar emoji"/>
            <p>Avatars</p>
          </div>
      </div>


   </div>
  </body>
</html>
